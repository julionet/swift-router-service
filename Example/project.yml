name: SwiftApp
options:
  deploymentTarget:
    iOS: 15.0
configs:
  Debug:
    buildConfiguration: debug
  Release:
    buildConfiguration: release
schemes:
  SwiftApp:
    build:
      targets:
        SwiftApp: all
        SwiftAppTests: [test]
    test:
      targets:
        - SwiftAppTests
    run:
      config: Debug
    archive:
      config: Release
targets:
  SwiftApp:
    type: application
    platform: iOS
    sources:
      - path: SwiftApp
    settings:
      base:
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: 1
        PRODUCT_BUNDLE_IDENTIFIER: com.github.julionet.swift-app.SwiftApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ENABLE_BITCODE: no
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: libsqlite3.tbd

  SwiftAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SwiftAppTests
    settings:
      base:
        SWIFT_VERSION: 5.0
        PRODUCT_BUNDLE_IDENTIFIER: com.github.swift-app.SwiftAppTests
        TARGETED_DEVICE_FAMILY: 1
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SwiftApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SwiftApp
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SwiftApp
      - sdk: XCTest.framework
